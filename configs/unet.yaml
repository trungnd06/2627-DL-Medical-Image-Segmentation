# M1 starting configuration; training loop/model are implemented in step 4.
experiment: M1_unet_bce_dice
seed: 42
data:
  image_size: [256, 256]  # height, width
  resize_mode: letterbox  # preserve aspect ratio; center with equal padding
  image_pad_value: 0      # black RGB padding before ImageNet normalization
  mask_threshold: 127
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate90: true
loader:
  batch_size: 8
  num_workers: 0  # portable starting point for Windows/Jupyter
  pin_memory: false  # enable when benchmarking CUDA training
model:
  name: unet
  channels: [32, 64, 128, 256, 512]
  output_channels: 1
training:
  optimizer: Adam
  learning_rate: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  ignore_padding: true   # future loss must use batch["valid_mask"]
  scheduler:
    name: ReduceLROnPlateau
    monitor: val_dice
    mode: max
    factor: 0.5
    patience: 5
    min_lr: 0.000001
  early_stopping_patience: 20
  checkpoint_metric: val_dice
evaluation:
  threshold: 0.5
  original_resolution: true
