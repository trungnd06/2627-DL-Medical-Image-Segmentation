experiment: M2_resnet34_imagenet_bce_dice
seed: 42
data:
  image_size:
  - 256
  - 256
  resize_mode: letterbox
  image_pad_value: 0
  mask_threshold: 127
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate90: true
loader:
  batch_size: 8
  num_workers: 0
  pin_memory: false
model:
  name: pretrained_unet
  encoder_weights: imagenet
  decoder_channels:
  - 256
  - 128
  - 64
  - 32
  - 16
  output_channels: 1
training:
  device: auto
  amp: true
  optimizer: Adam
  learning_rate: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  ignore_padding: true
  scheduler:
    name: ReduceLROnPlateau
    monitor: val_dice
    mode: max
    factor: 0.5
    patience: 5
    min_lr: 1.0e-06
  early_stopping_patience: 20
  checkpoint_metric: val_dice
evaluation:
  threshold: 0.5
  original_resolution: true
